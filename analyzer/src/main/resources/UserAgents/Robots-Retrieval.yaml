# These are examples of robot/spider/bot useragents we have seen.

config:

# User-triggered retrieval agents; exact product names keep desktop apps distinct.
# Like ChatGPT-User, Robot describes retrieval software, not whether to block it.
# DeviceBrand follows the declared product; this does not verify the sender.
- lookup:
    name: NamedRetrievalAgents
    map:
      Claude-User: Anthropic|Claude-User
      Perplexity-User: Perplexity|Perplexity-User

- matcher:
    variable:
    - 'RobotProductName                    :agent.product.name?NamedRetrievalAgents'
    - 'RobotProduct                        :LookUp[NamedRetrievalAgents;@RobotProductName]'
    - 'RobotProductVersion                 :@RobotProductName^.version'
    require:
    - 'IsNull[@RobotProductVersion.url]'
    - 'IsNull[agent.product.name?TagsKnownNotToBeRobots]'
    - 'IsNull[agent.(1-2)product.comments.entry.(1-2)product.name?TagsKnownNotToBeRobots]'
    extract:
    - '__Set_ALL_Fields__                  :   399911 :"<<<null>>>"' # Keep below the explicit field confidences to preserve their values.
    - 'DeviceClass                         :   400011 :"Robot"'
    - 'DeviceBrand                         :   400011 :@RobotProduct[[1]]'
    - 'DeviceName                          :   400011 :@RobotProduct[[2]]'
    - 'OperatingSystemClass                :   400011 :"Cloud"'
    - 'OperatingSystemName                 :   400011 :"Cloud"'
    - 'OperatingSystemVersion              :   400011 :"<<<null>>>"'
    - 'OperatingSystemNameVersion          :   400010 :"<<<null>>>"'
    - 'OperatingSystemNameVersionMajor     :   400010 :"<<<null>>>"'
    - 'LayoutEngineClass                   :   400011 :"Robot"'
    - 'LayoutEngineName                    :   400011 :@RobotProduct[[2]]'
    - 'LayoutEngineVersion                 :   400011 :@RobotProductVersion'
    - 'AgentClass                          :   400011 :"Robot"'
    - 'AgentName                           :   400011 :@RobotProduct[[2]]'
    - 'AgentVersion                        :   400011 :@RobotProductVersion'

