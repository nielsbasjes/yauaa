# Retrieval declarations and controls: desktop apps and similarly named products.

- test:
    input:
      User-Agent                           : 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Claude-User/1.0; +claude-user@anthropic.com)'
    expected:
      DeviceClass                          : 'Robot'
      DeviceName                           : 'Anthropic Claude-User'
      DeviceBrand                          : 'Anthropic'
      OperatingSystemClass                 : 'Cloud'
      OperatingSystemName                  : 'Cloud'
      OperatingSystemVersion               : '??'
      OperatingSystemVersionMajor          : '??'
      OperatingSystemNameVersion           : 'Cloud ??'
      OperatingSystemNameVersionMajor      : 'Cloud ??'
      LayoutEngineClass                    : 'Robot'
      LayoutEngineName                     : 'Claude-User'
      LayoutEngineVersion                  : '1.0'
      LayoutEngineVersionMajor             : '1'
      LayoutEngineNameVersion              : 'Claude-User 1.0'
      LayoutEngineNameVersionMajor         : 'Claude-User 1'
      AgentClass                           : 'Robot'
